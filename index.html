<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CalcPT v0.2.3</title>

<!-- Ícone da app na barra de tarefas -->
<link rel="icon" type="image/png" href="calc-icon.png" />

<!-- Campo de edição matemática -->
<script src="https://cdn.jsdelivr.net/npm/mathlive/mathlive.min.js"></script>
<!-- Motor de cálculo -->
<script src="https://cdn.jsdelivr.net/npm/mathjs@13/lib/browser/math.js"></script>
<!-- Renderização estática do histórico -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

<style>
  :root{
    --bg: #1e1e1e;
    --panel: #252526;
    --panel-2: #1a1a1a;
    --border: #333333;
    --text: #d4d4d4;
    --text-dim: #8a8a8a;
    --blue: #61afef;
    --green: #98c379;
    --accent: #e5c07b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .calculator {
    width: 420px;
    max-width: 96vw;
    height: 90vh;
    max-height: 840px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 25px 70px rgba(0,0,0,0.55);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .titlebar {
    padding: 10px 16px;
    font-size: 0.78rem;
    letter-spacing: 0.3px;
    color: var(--text-dim);
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .titlebar .name { color: var(--text); font-weight: 600; }

  .history-panel {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    scrollbar-width: thin;
    scrollbar-color: #444 transparent;
  }
  .history-panel::-webkit-scrollbar { width: 8px; }
  .history-panel::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; }

  .history-content {
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 100%;
  }

  .history-empty {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.85rem;
    line-height: 1.6;
  }

  .history-row {
    min-height: fit-content;
    height: auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-start;
    width: 100%;
    gap: 6px 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid #2a2a2a;
  }
  .history-row:last-child { border-bottom: none; padding-bottom: 0; }

  .history-input {
    color: var(--blue);
    text-align: left;
    flex: 1 1 auto;
    min-width: 40%;
    max-width: 100%;
  }
  .history-result {
    color: var(--green);
    font-weight: 700;
    text-align: right;
    flex: 0 1 auto;
    max-width: 100%;
  }
  .history-result.error { color: #e06c75; font-weight: 600; }

  .roots-list {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    max-width: 100%;
  }

  .history-mathfield {
    display: block;
    max-width: 100%;
    line-height: 2;
  }
  .math-chunk {
    display: inline-block;
    white-space: nowrap;
    max-width: 100%;
    font-size: 1.05rem;
  }
  .math-chunk .katex,
  .math-chunk .ML__latex { font-size: 1em; }

  .history-input .katex, .history-input .ML__latex { color: var(--blue); }
  .history-result .katex, .history-result .ML__latex,
  .roots-list .katex, .roots-list .ML__latex { color: var(--green); }

  .mathfield-wrapper {
    padding: 14px 16px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  math-field {
    width: 100%;
    display: block;
    background: transparent;
    font-size: 1.5rem;
    color: #ffffff;
    --caret-color: #ffffff;
    --primary-color: #61afef;
    --selection-background-color: #2c5aa0;
    --contains-highlight-background-color: #33475b;
    border: none;
  }
  math-field::part(content) { color: #ffffff; }

  .mode-bar {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    background: var(--bg);
  }
  .mode-btn {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 8px;
    padding: 9px 6px;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.3px;
    transition: border-color 0.15s, color 0.15s;
  }
  .mode-btn:hover { border-color: #555; }
  .mode-btn.active { border-color: var(--blue); color: var(--blue); background: #1d2b38; }

  .keys-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
    padding: 10px 16px 16px;
    background: var(--bg);
  }
  .key-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 2px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: background 0.12s, border-color 0.12s;
  }
  .key-btn:hover { background: #2d2d30; border-color: #4a4a4a; }
  .key-btn:active { background: #34343a; }

  .key-btn.clear-btn {
    grid-column: span 2;
    color: #e06c75;
    font-size: 0.72rem;
  }
  .key-btn.ac-btn {
    color: #e06c75;
    font-weight: 700;
  }

  body.embed .calculator {
    width: 100%;
    height: 100%;
    max-height: none;
    border-radius: 0;
    border: none;
    box-shadow: none;
  }
  /* Remove as restrições de largura quando instalada como app nativa */
  @media (display-mode: standalone) {
    .calculator {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
    }
  }
</style>
</head>
<body>

<div class="calculator">
  <div class="titlebar">
    <span class="name">CalcPT <span style="color:var(--text-dim); font-weight:400;">v0.2.3</span></span>
    <span id="status-label">pronto</span>
  </div>

  <div class="history-panel" id="history-panel">
    <div class="history-content" id="history-content">
      <div class="history-empty" id="history-empty">
        Escreve uma expressão e prime Enter.<br>
        Ex.: <em>3/4 + √2</em> &nbsp;·&nbsp; <em>2/x = x+1</em>
      </div>
    </div>
  </div>

  <div class="mathfield-wrapper" id="mathfield-wrapper">
    <math-field id="mathfield" virtual-keyboard-mode="off" smart-fence="true"></math-field>
  </div>

  <div class="mode-bar">
    <button class="mode-btn" id="deg-rad-btn">DEG</button>
    <button class="mode-btn" id="exact-btn">Aproximado</button>
  </div>

  <div class="keys-grid" id="keys-grid">
    <button class="key-btn" data-cmd="pow">xʸ</button>
    <button class="key-btn" data-cmd="sqrt">√</button>
    <button class="key-btn" data-cmd="cbrt">³√</button>
    <button class="key-btn" data-cmd="frac">a/b</button>
    <button class="key-btn" data-cmd="pi">π</button>
    <button class="key-btn" data-cmd="euler">e</button>
    <button class="key-btn" data-cmd="parens">( )</button>
    <button class="key-btn" data-cmd="varx">x</button>

    <button class="key-btn" data-cmd="sin">sin</button>
    <button class="key-btn" data-cmd="cos">cos</button>
    <button class="key-btn" data-cmd="tan">tan</button>
    <button class="key-btn" data-cmd="log">log</button>
    <button class="key-btn" data-cmd="ln">ln</button>
    <button class="key-btn ac-btn" data-cmd="ac">AC</button>
    <button class="key-btn clear-btn" data-cmd="clear">Limpar Histórico</button>
  </div>
</div>

<script>
(function(){
  const missingLibs = [];
  if (typeof MathLive === 'undefined') missingLibs.push('MathLive');
  if (typeof math === 'undefined') missingLibs.push('math.js');
  if (missingLibs.length > 0) {
    const banner = document.createElement('div');
    banner.style.cssText =
      'background:#4a1f24;color:#f0b8bb;padding:12px 16px;font-size:0.85rem;' +
      'line-height:1.6;border-bottom:1px solid #6b2a30;';
    banner.innerHTML =
      '<strong>⚠️ Falha ao carregar: ' + missingLibs.join(' e ') + '</strong><br>' +
      'Sem estas bibliotecas o campo matemático não fica editável.<br>' +
      'Verifica a ligação à internet e consulta a consola (F12).';
    document.querySelector('.calculator').prepend(banner);
    document.getElementById('status-label').textContent = 'erro: libs';
    return;
  }

  let degMode = true;
  let exactMode = false;
  let history = [];
  let lastAnsLatex = null;

  const mf = document.getElementById('mathfield');
  const historyPanel = document.getElementById('history-panel');
  const historyContent = document.getElementById('history-content');
  const historyEmpty = document.getElementById('history-empty');
  const degRadBtn = document.getElementById('deg-rad-btn');
  const exactBtn = document.getElementById('exact-btn');

  const mathFraction = math.create(math.all, { number: 'Fraction' });

  function scrollHistoryToBottom() {
    historyPanel.scrollTop = historyPanel.scrollHeight;
  }

  if (window.ResizeObserver) {
    new ResizeObserver(scrollHistoryToBottom).observe(historyContent);
  }

  function focusMathField(retries) {
    retries = (typeof retries === 'number') ? retries : 30;
    try { mf.focus(); } catch (err) { }
    const focused = document.activeElement === mf || (mf.hasFocus && mf.hasFocus());
    if (!focused && retries > 0) {
      setTimeout(() => focusMathField(retries - 1), 100);
    }
  }

  focusMathField();
  window.addEventListener('load', () => focusMathField());
  document.getElementById('mathfield-wrapper').addEventListener('click', () => mf.focus());

  updateModeLabels();

  document.getElementById('keys-grid').addEventListener('click', (e) => {
    const btn = e.target.closest('.key-btn');
    if (!btn) return;
    const cmd = btn.dataset.cmd;

    switch (cmd) {
      case 'pow':    mf.insert('{#@}^{#?}', {focus:true}); break;
      case 'sqrt':   mf.insert('\\sqrt{#?}', {focus:true}); break;
      case 'cbrt':   mf.insert('\\sqrt[3]{#?}', {focus:true}); break;
      case 'frac':   mf.insert('\\frac{#?}{#?}', {focus:true}); break;
      case 'pi':     mf.insert('\\pi', {focus:true}); break;
      case 'euler':  mf.insert('e', {focus:true}); break;
      case 'parens': mf.insert('\\left(#?\\right)', {focus:true}); break;
      case 'varx':   mf.insert('x', {focus:true}); break;
      case 'sin':    mf.insert('\\sin\\left(#?\\right)', {focus:true}); break;
      case 'cos':    mf.insert('\\cos\\left(#?\\right)', {focus:true}); break;
      case 'tan':    mf.insert('\\tan\\left(#?\\right)', {focus:true}); break;
      case 'log':    mf.insert('\\log\\left(#?\\right)', {focus:true}); break;
      case 'ln':     mf.insert('\\ln\\left(#?\\right)', {focus:true}); break;
      case 'ac':     mf.setValue(''); break;
      case 'clear':  clearHistory(); break;
    }
    mf.focus();
  });

  degRadBtn.addEventListener('click', () => {
    degMode = !degMode;
    updateModeLabels();
    mf.focus();
  });

  exactBtn.addEventListener('click', () => {
    exactMode = !exactMode;
    updateModeLabels();
    if (history.length > 0) {
      const lastIndex = history.length - 1;
      const lastRawLatex = history[lastIndex].inputLatex;
      const refreshedEntry = processInput(lastRawLatex);
      history[lastIndex] = refreshedEntry;
      if (refreshedEntry.type !== 'error') {
        lastAnsLatex = refreshedEntry.ansLatex;
      }
    }
    renderHistory();
    mf.focus();
  });

  function updateModeLabels() {
    degRadBtn.textContent = degMode ? 'DEG' : 'RAD';
    degRadBtn.classList.toggle('active', true);
    exactBtn.textContent = exactMode ? 'Exato' : 'Aproximado';
    exactBtn.classList.toggle('active', exactMode);
  }

  mf.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleEnter();
      return;
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      mf.setValue('');
      return;
    }
    const opLatex = { '+': '+', '-': '-', '*': '\\times ', '/': '/' };
    if (opLatex[e.key] && lastAnsLatex !== null) {
      const current = mf.getValue('latex').trim();
      if (current === '') {
        e.preventDefault();
        mf.insert(lastAnsLatex);
        mf.insert(opLatex[e.key]);
      }
    }
  });

  function handleEnter() {
    const latex = mf.getValue('latex').trim();
    if (!latex) return;
    const entry = processInput(latex);
    history.push(entry);
    if (entry.type !== 'error') {
      lastAnsLatex = entry.ansLatex;
    }
    mf.setValue('');
    renderHistory();
    mf.focus();
  }

  function clearHistory() {
    history = [];
    lastAnsLatex = null;
    renderHistory();
    mf.focus();
  }

  function stripOuterParens(text) {
    if (text.length >= 2 && text[0] === '(' && text[text.length - 1] === ')') {
      const inner = text.slice(1, -1);
      if (!/[(){}]/.test(inner)) return inner;
    }
    return text;
  }

  function matchGroupBack(str, pos) {
    const close = str[pos - 1];
    const open = close === '}' ? '{' : '(';
    let depth = 0, k = pos - 1;
    while (k >= 0) {
      const c = str[k];
      if (c === close) depth++;
      else if (c === open) { depth--; if (depth === 0) break; }
      k--;
    }
    return (k >= 0 && depth === 0) ? k : -1;
  }

  function takeOperandBack(head) {
    let pos = head.length;
    if (pos === 0) return null;
    const chunks = [];
    if (head[pos - 1] === '}') {
      const k = matchGroupBack(head, pos);
      if (k > 0 && head[k - 1] === '^') {
        chunks.unshift(head.slice(k - 1, pos));
        pos = k - 1;
      }
    } else if (pos >= 2 && head[pos - 2] === '^' && /[0-9a-zA-Z.]/.test(head[pos - 1])) {
      chunks.unshift(head.slice(pos - 2, pos));
      pos -= 2;
    }
    if (pos === 0) return null;
    if (head[pos - 1] === '}' || head[pos - 1] === ')') {
      const k = matchGroupBack(head, pos);
      if (k < 0) return null;
      chunks.unshift(head.slice(k, pos));
      pos = k;
    } else if (/[0-9a-zA-Z.]/.test(head[pos - 1])) {
      let p = pos - 1;
      while (p >= 0 && /[0-9a-zA-Z.]/.test(head[p])) p--;
      chunks.unshift(head.slice(p + 1, pos));
      pos = p + 1;
    } else {
      return null;
    }
    let guard = 0;
    while (pos > 0 && guard++ < 20) {
      const c = head[pos - 1];
      if (/[0-9a-zA-Z.]/.test(c)) {
        let p = pos - 1;
        while (p >= 0 && /[0-9a-zA-Z.]/.test(head[p])) p--;
        chunks.unshift(head.slice(p + 1, pos));
        pos = p + 1;
        continue;
      }
      if (c === '}') {
        const k = matchGroupBack(head, pos);
        if (k < 0) break;
        chunks.unshift(head.slice(k, pos));
        pos = k;
        continue;
      }
      if (/[a-zA-Z]/.test(c)) {
        let p = pos - 1;
        while (p >= 0 && /[a-zA-Z]/.test(head[p])) p--;
        if (p >= 0 && head[p] === '\\') {
          chunks.unshift(head.slice(p, pos));
          pos = p;
          continue;
        }
      }
      break;
    }
    return { text: chunks.join(''), head: head.slice(0, pos) };
  }

  function takeOperandFwd(s, i) {
    const n = s.length;
    if (i >= n) return null;
    let end = i;
    if (s[i] === '{' || s[i] === '(') {
      const open = s[i], close = open === '{' ? '}' : ')';
      let depth = 0, k = i;
      while (k < n) {
        if (s[k] === open) depth++;
        else if (s[k] === close) { depth--; if (depth === 0) break; }
        k++;
      }
      if (k >= n) return null;
      end = k + 1;
    } else if (/[0-9a-zA-Z.]/.test(s[i])) {
      while (end < n && /[0-9a-zA-Z.]/.test(s[end])) end++;
    } else if (s[i] === '\\') {
      const m = /^\\[a-zA-Z]+/.exec(s.slice(i));
      if (!m) return null;
      end = i + m[0].length;
      while (end < n && (s[end] === '{' || s[end] === '[')) {
        const open = s[end], close = open === '{' ? '}' : ']';
        let depth = 0, k = end;
        while (k < n) {
          if (s[k] === '{' || s[k] === '[') depth++;
          else if (s[k] === '}' || s[k] === ']') { depth--; if (depth === 0) break; }
          k++;
        }
        if (k >= n) break;
        end = k + 1;
      }
    } else {
      return null;
    }
    if (end < n && s[end] === '^') {
      if (end + 1 < n && s[end + 1] === '{') {
        let depth = 0, k = end + 1;
        while (k < n) {
          if (s[k] === '{') depth++;
          else if (s[k] === '}') { depth--; if (depth === 0) break; }
          k++;
        }
        if (k < n) end = k + 1;
      } else if (end + 1 < n) {
        end += 2;
      }
    }
    return { text: s.slice(i, end), end };
  }

  function fracify(s) {
    let out = '';
    let i = 0;
    const n = s.length;
    while (i < n) {
      const ch = s[i];
      if (ch === '\\') {
        const m = /^\\[a-zA-Z]+/.exec(s.slice(i));
        if (m) {
          const cmd = m[0];
          let j = i + cmd.length;
          let argsStr = '';
          while (j < n && (s[j] === '{' || s[j] === '[')) {
            const open = s[j], close = open === '{' ? '}' : ']';
            let depth = 0, k = j;
            while (k < n) {
              if (s[k] === '{' || s[k] === '[') depth++;
              else if (s[k] === '}' || s[k] === ']') { depth--; if (depth === 0) break; }
              k++;
            }
            if (k >= n) { argsStr += s.slice(j); j = n; break; }
            argsStr += open + fracify(s.slice(j + 1, k)) + close;
            j = k + 1;
          }
          out += cmd + argsStr;
          i = j;
          continue;
        }
        out += ch; i++; continue;
      }
      if (ch === '/') {
        const L = takeOperandBack(out);
        const R = takeOperandFwd(s, i + 1);
        if (L && R) {
          out = L.head + '\\frac{' + stripOuterParens(L.text) + '}{' + stripOuterParens(R.text) + '}';
          i = R.end;
          continue;
        }
        out += ch; i++; continue;
      }
      out += ch; i++;
    }
    return out;
  }

  function displayLatex(latex) {
    let s = latex.replace(/\\left|\\right/g, '');
    s = s.replace(/\\div\s*/g, '/');
    s = fracify(s);
    s = s.replace(/\\frac/g, '\\dfrac');
    return s;
  }

  function splitForWrap(latex) {
    const chunks = [];
    let buf = '';
    let depth = 0;
    let i = 0;
    const n = latex.length;

    while (i < n) {
      const ch = latex[i];
      if (ch === '\\') {
        const m = /^\\[a-zA-Z]+/.exec(latex.slice(i));
        if (m) {
          if ((m[0] === '\\times' || m[0] === '\\cdot') && depth === 0 && buf.trim() !== '') {
            chunks.push(buf.trim());
            buf = m[0];
            i += m[0].length;
            continue;
          }
          buf += m[0];
          i += m[0].length;
          continue;
        }
        buf += ch; i++; continue;
      }
      if (ch === '{' || ch === '(') { depth++; buf += ch; i++; continue; }
      if (ch === '}' || ch === ')') { depth--; buf += ch; i++; continue; }
      if (depth === 0 && (ch === '+' || ch === '=' || ch === '-') && buf.trim() !== '') {
        chunks.push(buf.trim());
        buf = ch;
        i++;
        continue;
      }
      buf += ch; i++;
    }
    if (buf.trim() !== '') chunks.push(buf.trim());
    return chunks.length ? chunks : [latex];
  }

  function findClosingBrace(str, openIndex) {
    let depth = 1;
    for (let i = openIndex + 1; i < str.length; i++) {
      if (str[i] === '{') depth++;
      else if (str[i] === '}') { depth--; if (depth === 0) return i; }
    }
    return -1;
  }

  function readArg(latex, pos) {
    if (latex[pos] === '{') {
      const close = findClosingBrace(latex, pos);
      return { content: latex.slice(pos + 1, close), end: close + 1 };
    }
    return { content: latex[pos] || '', end: pos + 1 };
  }

  function processSqrt(latex) {
    let out = latex;
    let idx;
    while ((idx = out.indexOf('\\sqrt')) !== -1) {
      let after = idx + 5;
      let rootDegree = null;
      if (out[after] === '[') {
        const closeBracket = out.indexOf(']', after);
        rootDegree = out.slice(after + 1, closeBracket);
        after = closeBracket + 1;
      }
      const arg = readArg(out, after);
      const replacement = rootDegree
        ? `nthRoot(${arg.content}, ${rootDegree})`
        : `sqrt(${arg.content})`;
      out = out.slice(0, idx) + replacement + out.slice(arg.end);
    }
    return out;
  }

  function processFrac(latex) {
    let out = latex;
    let idx;
    while ((idx = out.indexOf('\\frac')) !== -1) {
      let after = idx + 5;
      const num = readArg(out, after);
      const den = readArg(out, num.end);
      const replacement = `((${num.content})/(${den.content}))`;
      out = out.slice(0, idx) + replacement + out.slice(den.end);
    }
    return out;
  }

  function processSuperscript(latex) {
    let out = latex;
    let idx;
    while ((idx = out.indexOf('^{')) !== -1) {
      const after = idx + 1;
      const arg = readArg(out, after);
      out = out.slice(0, idx) + '^(' + arg.content + ')' + out.slice(arg.end);
    }
    return out;
  }

  function latexToExpr(rawLatex) {
    let s = rawLatex;
    s = s.replace(/\\left|\\right/g, '');
    s = processSqrt(s);
    s = processFrac(s);
    s = processSuperscript(s);
    s = s.replace(/\\cdot/g, '*');
    s = s.replace(/\\times/g, '*');
    s = s.replace(/\\div/g, '/');
    s = s.replace(/\\ln/g, 'log');
    s = s.replace(/\\log/g, 'log10');
    s = s.replace(/\\pi/g, 'pi');
    s = s.replace(/\\sin/g, 'sin');
    s = s.replace(/\\cos/g, 'cos');
    s = s.replace(/\\tan/g, 'tan');
    s = s.replace(/\\,|\\!|\\;|\\ /g, '');
    s = s.replace(/\{/g, '(').replace(/\}/g, ')');
    s = s.replace(/\\/g, '');
    return s.trim();
  }

  function applyDegConversion(exprStr) {
    return exprStr.replace(/\b(sin|cos|tan)\(/g, '$1(pi/180*');
  }

  function formatApproxNumber(num) {
    if (typeof num !== 'number' || !isFinite(num)) return null;
    if (Number.isInteger(num)) return String(num);
    let s = num.toFixed(4);
    s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s;
  }

  function fractionToLatex(fr) {
    const numerator = fr.s * fr.n;
    const denominator = fr.d;
    if (denominator === 1) return String(numerator);
    return `\\frac{${numerator}}{${denominator}}`;
  }

  function simplifySqrt(n) {
    if (!Number.isInteger(n) || n < 0) return null;
    let coef = 1, inside = n;
    for (let f = 2; f * f <= inside; f++) {
      while (inside % (f * f) === 0) { inside /= f * f; coef *= f; }
    }
    return { coef, inside };
  }

  function toNiceFraction(x, maxDen) {
    maxDen = maxDen || 1000;
    if (Math.abs(x - Math.round(x)) < 1e-9) return { n: Math.round(x), d: 1 };
    let h1 = 1, h2 = 0, k1 = 0, k2 = 1, b = x;
    for (let i = 0; i < 30; i++) {
      const a = Math.floor(b);
      let aux = h1; h1 = a * h1 + h2; h2 = aux;
      aux = k1; k1 = a * k1 + k2; k2 = aux;
      if (Math.abs(b - a) < 1e-10 || k1 > maxDen) break;
      b = 1 / (b - a);
    }
    if (k1 === 0 || k1 > maxDen) return null;
    if (Math.abs(x - h1 / k1) > 1e-9) return null;
    return { n: h1, d: k1 };
  }

  function computeValue(exprAll, rawLatex) {
    const exprDeg = degMode ? applyDegConversion(exprAll) : exprAll;
    let approxVal;
    try {
      approxVal = math.evaluate(exprDeg);
    } catch (err) {
      return { type: 'error', inputLatex: rawLatex, message: 'Expressão inválida' };
    }
    const approxNum = (approxVal && approxVal.toNumber) ? approxVal.toNumber() : Number(approxVal);
    const approxLatex = formatApproxNumber(approxNum);
    if (approxLatex === null) {
      return { type: 'error', inputLatex: rawLatex, message: 'Erro numérico' };
    }
    let exactLatex = approxLatex;
    let ansLatex = approxLatex;
    try {
      const exactVal = mathFraction.evaluate(exprDeg);
      if (exactVal && typeof exactVal.n === 'number' && typeof exactVal.d === 'number') {
        exactLatex = fractionToLatex(exactVal);
        ansLatex = exactLatex;
      } else {
        throw new Error('resultado não é uma Fraction');
      }
    } catch (err) {
      const sqrtMatch = exprDeg.trim().match(/^sqrt\((\d+)\)$/);
      if (sqrtMatch) {
        const val = parseInt(sqrtMatch[1], 10);
        if (val === 0) {
          exactLatex = '0';
        } else {
          const simp = simplifySqrt(val);
          if (simp) {
            exactLatex = simp.inside === 1
              ? String(simp.coef)
              : (simp.coef === 1 ? `\\sqrt{${simp.inside}}` : `${simp.coef}\\sqrt{${simp.inside}}`);
          }
        }
        ansLatex = exactLatex;
      } else {
        const nice = toNiceFraction(approxNum, 999);
        if (nice) {
          exactLatex = nice.d === 1 ? String(nice.n) : `\\frac{${nice.n}}{${nice.d}}`;
          ansLatex = exactLatex;
        }
      }
    }
    return { type: 'value', inputLatex: rawLatex, approxLatex, exactLatex, ansLatex };
  }

  function computeEquation(exprAll, rawLatex) {
    const parts = exprAll.split('=');
    if (parts.length !== 2) {
      return { type: 'error', inputLatex: rawLatex, message: 'Equação inválida' };
    }
    const diffExprRaw = `(${parts[0]})-(${parts[1]})`;
    const diffExpr = degMode ? applyDegConversion(diffExprRaw) : diffExprRaw;
    let compiled;
    try {
      compiled = math.compile(diffExpr);
    } catch (err) {
      return { type: 'error', inputLatex: rawLatex, message: 'Equação inválida' };
    }
    const evalF = (x) => {
      try {
        const v = compiled.evaluate({ x });
        const n = (v && v.toNumber) ? v.toNumber() : Number(v);
        return isFinite(n) ? n : NaN;
      } catch (err) {
        return NaN;
      }
    };
    let exactRoots = null;
    const fm2 = evalF(-2), fm1 = evalF(-1), f0 = evalF(0), fp1 = evalF(1), fp2 = evalF(2);
    if ([fm2, fm1, f0, fp1, fp2].every(isFinite)) {
      const c = f0;
      const a = ((fp1 - c) + (fm1 - c)) / 2;
      const b = ((fp1 - c) - (fm1 - c)) / 2;
      const predicted = a * 4 + b * 2 + c;
      if (Math.abs(predicted - fp2) < 1e-6 * (1 + Math.abs(fp2))) {
        if (Math.abs(a) < 1e-9) {
          if (Math.abs(b) >= 1e-9) exactRoots = [-c / b];
        } else {
          const disc = b * b - 4 * a * c;
          if (disc >= -1e-7) {
            const d = Math.max(disc, 0);
            const r1 = (-b + Math.sqrt(d)) / (2 * a);
            const r2 = (-b - Math.sqrt(d)) / (2 * a);
            exactRoots = d < 1e-9 ? [r1] : [r1, r2];
          } else {
            exactRoots = [];
          }
        }
      }
    }
    const numericRoots = numericSolve(evalF);
    let candidates = numericRoots.slice();
    if (exactRoots) {
      exactRoots.forEach((r) => {
        if (!candidates.some((x) => Math.abs(x - r) < 1e-4)) candidates.push(r);
      });
    }
    candidates.sort((x, y) => x - y);
    if (candidates.length === 0) {
      return { type: 'equation', inputLatex: rawLatex, roots: [], ansLatex: null };
    }
    const roots = candidates.map((val) => {
      let exact = null;
      const niceFrac = toNiceFraction(val, 500);
      if (niceFrac) {
        exact = niceFrac.d === 1 ? String(niceFrac.n) : `\\frac{${niceFrac.n}}{${niceFrac.d}}`;
      }
      const approx = formatApproxNumber(val) || '0';
      return { approxLatex: approx, exactLatex: exact || approx, value: val };
    });
    const ansLatex = roots[0].exactLatex || roots[0].approxLatex;
    return { type: 'equation', inputLatex: rawLatex, roots, ansLatex };
  }

  function numericSolve(evalF) {
    const roots = [];
    const step = 0.02;
    const addRoot = (r) => {
      if (!roots.some((x) => Math.abs(x - r) < 1e-4)) roots.push(r);
    };
    let prevX = -10;
    let prevY = evalF(prevX);
    for (let x = -10 + step; x <= 10 + 1e-9; x += step) {
      const y = evalF(x);
      if (isFinite(prevY) && isFinite(y)) {
        if (Math.abs(prevY) < 1e-9) {
          addRoot(prevX);
        } else if (prevY * y < 0) {
          const initialScale = Math.max(Math.abs(prevY), Math.abs(y), 1e-9);
          let a = prevX, b = x, fa = prevY;
          for (let i = 0; i < 60; i++) {
            const m = (a + b) / 2;
            const fm = evalF(m);
            if (!isFinite(fm)) break;
            if (fa * fm <= 0) { b = m; } else { a = m; fa = fm; }
          }
          const root = (a + b) / 2;
          const residual = evalF(root);
          if (isFinite(residual) && Math.abs(residual) < initialScale) {
            addRoot(root);
          }
        }
      }
      prevX = x;
      prevY = y;
    }
    return roots;
  }

  function processInput(rawLatex) {
    try {
      const exprAll = latexToExpr(rawLatex);
      if (exprAll.includes('=') && /x/.test(exprAll)) {
        return computeEquation(exprAll, rawLatex);
      }
      return computeValue(exprAll, rawLatex);
    } catch (err) {
      return { type: 'error', inputLatex: rawLatex, message: 'Erro ao processar' };
    }
  }

  function createDisplayField(latex) {
    const el = document.createElement('span');
    el.className = 'history-mathfield';
    const chunks = splitForWrap(latex);
    chunks.forEach((chunk) => {
      const c = document.createElement('span');
      c.className = 'math-chunk';
      let html = null;
      try {
        if (typeof katex !== 'undefined') {
          html = katex.renderToString(chunk, { throwOnError: false });
        } else if (MathLive.convertLatexToMarkup) {
          html = MathLive.convertLatexToMarkup(chunk);
        }
      } catch (err) {
        html = null;
      }
      if (html) c.innerHTML = html;
      else c.textContent = chunk;
      el.appendChild(c);
    });
    return el;
  }

  function fitChunks(root) {
    root.querySelectorAll('.math-chunk').forEach((c) => {
      c.style.fontSize = '';
      const parent = c.parentElement;
      if (!parent) return;
      const avail = parent.clientWidth;
      const need = c.scrollWidth;
      if (avail > 0 && need > avail) {
        const current = parseFloat(getComputedStyle(c).fontSize);
        const scaled = Math.max(current * (avail / need), 12);
        c.style.fontSize = scaled + 'px';
      }
    });
  }

  function renderHistory() {
    historyContent.innerHTML = '';
    if (history.length === 0) {
      historyContent.appendChild(historyEmpty);
      scrollHistoryToBottom();
      return;
    }
    history.forEach((entry) => {
      const row = document.createElement('div');
      row.className = 'history-row';
      const inputSpan = document.createElement('div');
      inputSpan.className = 'history-input';
      inputSpan.appendChild(createDisplayField(displayLatex(entry.inputLatex)));
      row.appendChild(inputSpan);
      const resultSpan = document.createElement('div');
      if (entry.type === 'error') {
        resultSpan.className = 'history-result error';
        resultSpan.textContent = entry.message;
      } else if (entry.type === 'value') {
        resultSpan.className = 'history-result';
        const latex = exactMode ? entry.exactLatex : entry.approxLatex;
        resultSpan.appendChild(createDisplayField(displayLatex(latex)));
      } else if (entry.type === 'equation') {
        resultSpan.className = 'history-result';
        if (entry.roots.length === 0) {
          resultSpan.textContent = 'Sem soluções reais';
        } else {
          const list = document.createElement('div');
          list.className = 'roots-list';
          entry.roots.forEach((r, i) => {
            const val = exactMode ? r.exactLatex : r.approxLatex;
            const line = document.createElement('div');
            line.appendChild(createDisplayField(displayLatex(`x_{${i + 1}}=${val}`)));
            list.appendChild(line);
          });
          resultSpan.appendChild(list);
        }
      }
      row.appendChild(resultSpan);
      historyContent.appendChild(row);
    });
    scrollHistoryToBottom();
    requestAnimationFrame(() => {
      fitChunks(historyContent);
      scrollHistoryToBottom();
      requestAnimationFrame(scrollHistoryToBottom);
    });
  }
})();
</script>

<script>
  if (new URLSearchParams(location.search).has('embed')) {
    document.body.classList.add('embed');

    const savedX = localStorage.getItem('calcX');
    const savedY = localStorage.getItem('calcY');
    const savedW = localStorage.getItem('calcW');
    const savedH = localStorage.getItem('calcH');
    
    const width = savedW ? parseInt(savedW) : 420;
    const height = savedH ? parseInt(savedH) : 700;
    window.resizeTo(width, height);

    if (savedX !== null && savedY !== null) {
      window.moveTo(parseInt(savedX), parseInt(savedY));
    }

    window.addEventListener('beforeunload', () => {
      localStorage.setItem('calcX', window.screenX);
      localStorage.setItem('calcY', window.screenY);
      localStorage.setItem('calcW', window.outerWidth);
      localStorage.setItem('calcH', window.outerHeight);
    });
  }
</script>
